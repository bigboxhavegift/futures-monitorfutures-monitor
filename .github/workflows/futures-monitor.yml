name: Futures Monitor - Multi Reports

on:
  schedule:
    # 日盘时段每30分钟运行
    # 09:00-15:00 CST = 01:00-07:00 UTC
    - cron: '*/30 1-6 * * 1-5'
    # 日盘收盘后固定时间运行 (15:30 CST = 07:30 UTC)
    - cron: '30 7 * * 1-5'
    # 夜盘时段每30分钟运行  
    # 21:00-23:00 CST = 13:00-15:00 UTC
    - cron: '*/30 13-15 * * 1-5'
    # 夜盘收盘后固定时间运行 (23:30 CST = 15:30 UTC)
    - cron: '30 15 * * 1-5'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install akshare pandas numpy
    
    - name: Run Futures Monitor (Main)
      run: |
        python3 futures_monitor.py
    
    - name: Run Aluminum Report
      run: |
        python3 aluminum_report.py
    
    - name: Run RSI Report
      run: |
        python3 rsi_report.py
    
    - name: Run Volume Surge Monitor
      run: |
        python3 volume_monitor.py
    
    - name: Run Pivot Points Analysis
      run: |
        python3 pivot_points.py
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
